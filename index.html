<style>
/* Layout: an exam "patient chart" — EMR-style section rail on the left, a monitor strip on ECG paper as the day's header, then dense working panels. */
:root{
  --bg:color-mix(in srgb,var(--accent) 7%,#fbfcfd); --surface:#ffffff; --surface-2:color-mix(in srgb,var(--accent) 7%,#f3f6f8); --border:color-mix(in srgb,var(--accent) 14%,#e2e7ec); --text:#0e1c22; --muted:#55686f; --faint:#8fa1a7;
  --accent:#0e7c6f; --accent-text:#ffffff;
  --good:#108a55; --good-soft:#e1f3ea; --warn:#b86e00; --warn-soft:#fbefd9; --bad:#c8324a; --bad-soft:#fbe6ea;
  --h0:#e6eded;
  --grid:rgba(214,96,86,.10); --grid-strong:rgba(214,96,86,.20);
  --shadow:0 1px 0 rgba(14,28,34,.04),0 12px 32px -18px rgba(14,28,34,.22);
  --radius:12px;
  --display:"Bricolage Grotesque","Readex Pro",system-ui,sans-serif;
  --body:"Instrument Sans","Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --arabic:"Readex Pro","Instrument Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--accent) 8%,#0a1116); --surface:color-mix(in srgb,var(--accent) 5%,#10181d); --surface-2:color-mix(in srgb,var(--accent) 10%,#151f25); --border:color-mix(in srgb,var(--accent) 18%,#222d34); --text:#e2edee; --muted:#8ea4aa; --faint:#5b7177;
  --accent:#3fd1b9; --accent-text:#06201c;
  --good:#3ccf8e; --good-soft:#123227; --warn:#f0b34a; --warn-soft:#352812; --bad:#ff7088; --bad-soft:#3a1820;
  --h0:#15272c;
  --grid:rgba(255,120,110,.06); --grid-strong:rgba(255,120,110,.12);
  --shadow:0 1px 0 rgba(0,0,0,.25),0 14px 34px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--accent) 8%,#0a1116); --surface:color-mix(in srgb,var(--accent) 5%,#10181d); --surface-2:color-mix(in srgb,var(--accent) 10%,#151f25); --border:color-mix(in srgb,var(--accent) 18%,#222d34); --text:#e2edee; --muted:#8ea4aa; --faint:#5b7177;
  --accent:#3fd1b9; --accent-text:#06201c;
  --good:#3ccf8e; --good-soft:#123227; --warn:#f0b34a; --warn-soft:#352812; --bad:#ff7088; --bad-soft:#3a1820;
  --h0:#15272c;
  --grid:rgba(255,120,110,.06); --grid-strong:rgba(255,120,110,.12);
  --shadow:0 1px 0 rgba(0,0,0,.25),0 14px 34px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{--accent2:#0b4f6c;--accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));--h1:color-mix(in srgb,var(--accent) 30%,var(--h0));--h2:color-mix(in srgb,var(--accent) 55%,var(--h0));--h3:color-mix(in srgb,var(--accent) 80%,var(--h0));--h4:var(--accent)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
.ar{font-family:var(--arabic);direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.mono,.big,.timer,.date,.ro b{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,.big,.hello,.brand-name{font-family:var(--display);text-wrap:balance}

/* ---------- frame ---------- */
.wrap{max-width:1280px;margin:0 auto;padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:212px minmax(0,1fr);gap:28px}
.side{position:sticky;top:22px;align-self:start;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{border:0;background:none;padding:9px 12px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14.5px;display:flex;gap:11px;align-items:center;text-align:start;transition:background .15s,color .15s}
.tab .ti{display:grid;place-items:center;width:20px;height:20px;flex:none}
.tab .ti svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab .tc{margin-inline-start:auto;font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab.on{color:var(--accent-text);background:var(--accent);box-shadow:0 8px 20px -10px var(--accent)}
.tab.on .ti{color:inherit}
.tab.on .tc{background:rgba(255,255,255,.25);color:inherit}
.side-foot{display:flex;gap:6px}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);padding:0}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{color:var(--text)}
.mainc{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-title{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.05}
.page-title{color:var(--text)}
.page-title small{color:var(--accent)!important;display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.chips{display:flex;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;flex-wrap:wrap}
.ro{padding:7px 14px;border-inline-start:1px solid var(--border);display:flex;flex-direction:column;line-height:1.2}
.ro:first-child{border-inline-start:0}
.ro span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ro b{font-size:17px;font-weight:700}
.ro b small{font-size:11px;color:var(--muted);font-weight:500;margin-inline-start:2px}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:14px 104px}
  .side{position:static;flex-direction:row;align-items:center;justify-content:space-between}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:space-around;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:10.5px;padding:5px 2px;flex:1;min-width:0;text-align:center;position:relative}
  .tab .tc{position:absolute;top:0;inset-inline-end:8%;margin:0;font-size:9.5px;padding:0 5px}
  .tab.on{box-shadow:none;background:var(--accent-soft);color:var(--accent)}
  .top{align-items:stretch}
  .page-title{font-size:24px}
  .chips{width:100%}
  .ro{flex:1;min-width:0;padding:6px 10px}
}

/* ---------- panels ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card h3{margin:0 0 14px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{margin-inline-start:auto;text-transform:none;letter-spacing:0}
.sub{color:var(--muted);font-size:13px}
.big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.hidden{display:none!important}
.lbl-u{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* monitor strip on ECG paper */
.ecg{position:relative;overflow:hidden;padding:20px 22px 12px;background-color:var(--surface);
  background-image:linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:25px 25px,25px 25px,5px 5px,5px 5px;background-position:-1px -1px}
.ecg-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.quote{font-size:21px;line-height:1.7;margin:10px 0 4px;font-weight:600}
.readouts{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
.readouts div{display:flex;flex-direction:column}
.readouts b{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.readouts span{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.readouts .warnv b{color:var(--warn)}
.trace{display:block;width:100%;height:74px;margin-top:6px}
.trace path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.trace .now{fill:var(--accent)}
@media (prefers-reduced-motion:no-preference){.trace path{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.6s ease-out}}
@keyframes draw{from{stroke-dashoffset:1}}
.ecg-cap{font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.hero{position:relative;border-radius:18px;overflow:hidden;color:#fff;background-color:var(--accent);

.hero-in{position:relative;padding:26px 28px 10px;max-width:680px}
.hero-eye{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero-h{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,40px);line-height:1.05;letter-spacing:-.03em;margin:6px 0 8px;max-width:20ch;text-shadow:0 2px 18px rgba(0,0,0,.18)}
.hero-ar{font-size:16px;font-weight:600;opacity:.95;margin-bottom:16px;text-align:start;direction:rtl;unicode-bidi:plaintext}
.vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.vt{color:#10202a;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:10px 12px;min-width:0;display:flex;flex-direction:column}
.vt span{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.vt b{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.vt b em{font-style:normal;font-size:15px;opacity:.75;margin-inline-start:2px;letter-spacing:0}
.vt small{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar{height:4px;border-radius:9px;background:rgba(16,32,42,.12);margin-top:8px;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.hero .trace{height:56px;margin-top:8px}
.hero .trace path{stroke:#fff;opacity:.9}
.hero .ecg-cap{color:rgba(255,255,255,.75)}

.card.behind{border-color:color-mix(in srgb,var(--warn) 50%,var(--border));background:color-mix(in srgb,var(--warn) 5%,var(--surface))}
/* pomodoro + buddy */
.obsteps{display:grid;gap:16px}
a.btn{text-decoration:none;display:inline-block}
.obstep{display:flex;gap:12px;align-items:flex-start}
.askmodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.askmode{display:flex;gap:12px;align-items:center;text-align:start;border:2px solid var(--border);background:var(--surface);border-radius:14px;padding:12px 14px;transition:.15s;color:var(--text)}
.askmode:hover{border-color:var(--accent)}
.askmode.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);box-shadow:0 10px 24px -14px var(--accent)}
.askmode b{display:block;font-size:15px}
.askmode small{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.am-i{font-size:22px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.askmode.on .am-i{background:rgba(255,255,255,.2)}
@media (max-width:520px){.askmodes{grid-template-columns:1fr}}
.logbox{margin-top:10px;border:1.5px dashed var(--accent);border-radius:10px;padding:10px 12px;background:var(--surface)}
.logbox.good{border-style:solid;border-color:color-mix(in srgb,var(--good) 60%,var(--border))}
.logcands{display:grid;gap:6px;margin-top:8px}
.logcand{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.logcand input{width:auto;margin-top:3px;flex:none}
.term{border-bottom:2px solid color-mix(in srgb,var(--accent) 60%,transparent);font-weight:600;cursor:help}
.mdcards{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:10px 0;background:var(--surface)}
.mdcard{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.mdcard:last-child{border-bottom:0}
.mdcard-ic{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.mdcard-t{font-weight:700;font-size:15.5px}
.mdcard-s{color:var(--muted);font-size:13px;margin:2px 0 4px}
.mdcard ul{margin:4px 0 0;padding-inline-start:18px}
.mdflow{border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;display:grid;gap:6px;background:var(--surface)}
.mdflow-step{text-align:center;padding:10px 12px;border-radius:10px;font-weight:600}
.mdflow-step.soft{background:var(--surface-2);border:1px solid var(--border)}
.mdflow-step.hi{background:var(--good-soft)}
.mdflow-ar{text-align:center;color:var(--muted);font-weight:700;line-height:1}
.mdquiz{border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;background:var(--surface);display:grid;gap:6px}
.mdquiz-q{font-weight:700;margin-bottom:4px}
.mdquiz-o{display:flex;gap:10px;align-items:center;text-align:start;background:none;border:1px solid transparent;border-radius:10px;padding:7px 8px;width:100%}
.mdquiz-o:hover{background:var(--surface-2)}
.mdquiz-o i{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);flex:none}
.mdquiz-o.right{background:var(--good-soft);border-color:var(--good)}.mdquiz-o.right i{background:var(--good);border-color:var(--good)}
.mdquiz-o.wrong{background:var(--bad-soft);border-color:var(--bad)}.mdquiz-o.wrong i{background:var(--bad);border-color:var(--bad)}
.mdquiz-why{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:14px}
.mdpre{background:var(--surface-2);border-radius:8px;padding:10px;overflow:auto;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
mark.lead{background:color-mix(in srgb,#ffd400 70%,transparent);color:inherit;border-radius:3px;padding:0 2px;cursor:help}
.revstem{font-size:15.5px;line-height:1.7}
.revgrid{display:grid;gap:16px}
.revgrid.withlabs{grid-template-columns:minmax(0,1fr) 280px}
@media (max-width:800px){.revgrid.withlabs{grid-template-columns:1fr}}
.revopts{display:grid;gap:8px}
.revopt{text-align:start;background:var(--surface);cursor:pointer;width:100%}
.revopt:hover:not(:disabled){border-color:var(--accent)}
.revopt:disabled{cursor:default;color:inherit}
.revopt.dim{opacity:.75}
.labs{border:1px solid var(--border);border-radius:10px;padding:10px 12px;max-height:520px;overflow:auto;align-self:start;background:var(--surface-2)}
.labrow{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
.labrow small{grid-column:1/-1;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.labrow.ref small{grid-column:auto;text-align:end}
.labrow.high b{color:var(--bad)}.labrow.low b{color:var(--warn)}
.opsbox{margin-top:10px;border:1.5px dashed var(--accent);border-radius:10px;padding:10px 12px;background:var(--surface)}
.opsbox.done{border-style:solid;border-color:var(--good)}
.opsbox ul{margin:6px 0 8px;padding-inline-start:18px}
.opsbox li{margin:2px 0}
.nbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:8px}
.nbc{text-align:start;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.nbc:hover{border-color:var(--faint)}
.nbc.done{background:var(--good-soft);border-color:transparent}
.nbc.planned{border-style:dashed;border-color:var(--accent)}
.askwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.askside{position:sticky;top:90px;max-height:calc(100vh - 120px);overflow:auto}
.askitem{display:flex;align-items:center;gap:2px;border-radius:8px}
.askitem.on{background:var(--accent-soft)}
.askopen{flex:1;min-width:0;text-align:start;background:none;border:0;padding:7px 8px;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.askopen small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.asklog{display:grid;gap:12px;max-height:62vh;overflow:auto;padding:2px}
.bub{border-radius:14px;padding:12px 14px;max-width:92%;min-width:0;overflow-wrap:anywhere}
.bub.me{justify-self:end;background:var(--accent-soft);border-end-end-radius:4px}
.bub.bot{justify-self:start;background:var(--surface-2);border-end-start-radius:4px}
.bub .md p,.bub .md li,.bub .md h3{text-align:start}
.md bdi{unicode-bidi:isolate}
.bub .md td,.bub .md th,.md td,.md th{overflow-wrap:normal;word-break:normal}
.md th{white-space:nowrap}
.md table{min-width:max-content;max-width:none}
.md .tblwrap{overflow-x:auto}
.bub .md h3{color:var(--accent)}
.askhello{text-align:center;padding:36px 10px;color:var(--text)}
.askhello .e{font-size:34px}
.askbox{border-radius:12px;padding:10px;margin-top:10px}
@media (max-width:900px){.askwrap{grid-template-columns:1fr}.askside{position:static;max-height:none;order:2}
  .tabs{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 64px}}
.obq{padding:14px 0;border-bottom:1px solid var(--border);display:grid;gap:8px}
.obq:last-of-type{border-bottom:0}
.obn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;flex:none}
.obbody{display:grid;gap:6px;padding-inline-start:34px}
.obbody>input,.obbody>select{max-width:320px}
.obdef{font-size:12px}
.obper{border:1px dashed var(--border);border-radius:10px;padding:10px;margin-bottom:8px}
.obsj{display:flex;align-items:center;gap:6px;padding:4px 0}
.obsj>span:nth-child(2){flex:1;font-weight:600;min-width:0}
@media (max-width:520px){.obbody{padding-inline-start:0}}
.tour{position:fixed;inset:0;z-index:90}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px color-mix(in srgb,#04121c 62%,transparent),0 0 0 3px var(--accent);pointer-events:none;transition:all .25s}
.tour-card{position:fixed;width:min(380px,calc(100vw - 24px));background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.obgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:8px}
.obsub{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;min-width:0}
.obsub span{flex:1;min-width:0;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obsub input[type=number]{width:68px;flex:none}
.obsub .sc,.obsj .sc{flex:none;margin:0}
.obsub small{color:var(--muted);font-family:var(--mono);font-size:11.5px;flex:none}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.mst{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.mst b{font-family:var(--mono);font-size:19px}.mst b small{font-size:11px;color:var(--muted)}
.mst span{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.d7{width:12px;height:12px;border-radius:3px;background:var(--surface-2)}.d7.on{background:var(--good)}
.msubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px 10px}
.msubs>div{display:flex;align-items:center;gap:4px}.msubs .bar{flex:1}
.uwlog{display:flex;gap:8px;align-items:center;margin-top:6px;padding:4px 4px 4px 10px;border-radius:8px;background:var(--surface-2);font-size:12.5px}
.sblist{display:grid;gap:8px;margin-top:8px}
.sbrow{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:10px}
.sbrow.cur{border-color:var(--accent);background:var(--accent-soft)}
.cat .frown,.cat .brows,.cat .vein{display:none}
.buddy.angry .frown,.buddy.angry .brows,.buddy.angry .vein{display:inline}
.buddy.angry .mouth,.buddy.angry .prop-book,.buddy.angry .prop-cup,.buddy.angry .eyes-happy{display:none}
.buddy.angry .eyes{display:inline}
.pomo:has(.buddy.angry) .buddy-stage{background:color-mix(in srgb,var(--bad) 12%,var(--surface-2))}
.pomo:has(.buddy.angry) .bubble{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.buddy.angry .cat{animation:shake .5s 2}.buddy.angry .vein{animation:throb 1s infinite}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes throb{50%{opacity:.4}}
/* hero quote & streak */
.hero-q{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.4vw,28px);line-height:1.2;letter-spacing:-.02em;margin:8px 0 6px;max-width:34ch;text-wrap:balance;text-shadow:0 2px 16px rgba(0,0,0,.2)}
.hero-cite{font-size:13.5px;font-weight:700}
.hero-q-ar{font-family:var(--arabic);font-size:clamp(22px,2.6vw,30px);line-height:1.6;max-width:28ch;text-align:start}
.hero-cite span{font-weight:500;opacity:.8}
.hero-ar{font-size:14px;font-weight:500;opacity:.9;margin:4px 0 16px}
.vitals{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.2fr)}
.vt-streak .flame{width:34px;height:34px;flex:none}
.vt-streak .row>div:nth-child(2){display:flex;flex-direction:column}
.vt-streak .flame path{fill:rgba(16,32,42,.18)}
.vt-streak.lit .flame path{fill:#ffb020}.vt-streak.lit .flame .core{fill:#fff3c4}
.vt-streak .flame .core{fill:rgba(16,32,42,.1)}
@media (prefers-reduced-motion:no-preference){.vt-streak.lit .flame{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}}
@keyframes flick{50%{transform:scale(1.06) rotate(-2deg)}}
.vt-streak .best{margin-inline-start:auto;text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.vt-streak .best b{display:block;font-size:18px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 4px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:2px}
.wk i{width:100%;max-width:26px;aspect-ratio:1;border-radius:7px;background:rgba(16,32,42,.08);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.wk .on i{background:var(--accent);color:#fff}
.wk .td i{outline:2px solid var(--accent);outline-offset:1px}
.wk .fut i{background:none;border:1.5px dashed rgba(16,32,42,.18)}
.wk small{font-size:9.5px;opacity:.8;font-family:var(--mono)}
.wq{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.3;margin:14px 0}
.wq cite{display:block;font-family:var(--body);font-style:normal;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
@media (max-width:700px){.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.vt-streak{grid-column:1/-1;order:-1}}
.pomo-grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:420px){.pomo-grid{grid-template-columns:1fr}}
.buddy-stage{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:44px;min-height:200px;border-radius:12px;background:var(--surface-2)}
.bubble{position:absolute;top:8px;left:8px;right:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.35;box-shadow:var(--shadow)}
.bubble:after{content:"";position:absolute;bottom:-6px;left:50%;width:10px;height:10px;background:var(--surface);border-right:1px solid var(--border);border-bottom:1px solid var(--border);transform:translateX(-50%) rotate(45deg)}
.buddy{background:none;border:0;padding:0;width:124px;margin-top:10px}
.cat{width:100%;display:block;overflow:visible}
.cat .eyes-happy,.cat .prop-cup{display:none}
.buddy.rest .eyes,.buddy.rest .prop-book{display:none}
.buddy.rest .eyes-happy,.buddy.rest .prop-cup{display:inline}
.buddy.idle .prop-book{display:none}
.buddy-name{font-weight:700;font-size:13px;margin-top:2px}
.buddy-name .mono{font-size:11px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:6px;align-items:center;margin:4px 0 12px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.dots .sub{margin-inline-start:6px}
.pomo .timer{text-align:start;font-size:56px;margin-top:8px}
.pomo[data-mode="short"] .timer,.pomo[data-mode="long"] .timer{color:var(--good)}
.pmodes button{font-size:12px;padding:4px 9px}
.yarn{position:absolute;font-size:26px;background:none;border:0;padding:0;transition:left .35s,top .35s;z-index:2}
.heart{position:absolute;bottom:60px;color:#e0565b;font-size:20px;pointer-events:none;animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .cat .eyes{animation:blink 4.5s infinite;transform-origin:60px 50px}
  .buddy.focus .cat-head{animation:read 3s ease-in-out infinite;transform-origin:60px 70px}
  .buddy.rest .cat-body .tail,.buddy.idle .cat-body .tail{animation:wag 1.4s ease-in-out infinite;transform-origin:88px 92px}
  .buddy.pounce .cat{animation:pounce .3s}
  .steam{animation:steam 2s ease-in-out infinite}
}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes read{0%,100%{transform:rotate(-3deg) translateY(1px)}50%{transform:rotate(3deg) translateY(2px)}}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes pounce{50%{transform:translateY(-8px) scale(1.05)}}
@keyframes steam{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.9;transform:translateY(-2px)}}
/* day progress */
.dose{display:flex;align-items:baseline;gap:8px}
.dose b{font-family:var(--mono);font-size:52px;font-weight:700;letter-spacing:-.05em;line-height:1}
.dose span{font-family:var(--mono);color:var(--muted);font-size:20px}
.segs{display:flex;gap:4px;margin:14px 0 12px}
.segs i{flex:1;height:10px;border-radius:3px;background:var(--surface-2)}
.segs i.on{background:var(--accent)}
.segs.full i.on{background:var(--good)}

/* orders (checklist) */
.task{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--border);transition:background .15s}
.task:last-of-type{border-bottom:0}
.task.done .tt{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--faint);background:var(--surface);flex:none;display:grid;place-items:center;color:var(--accent-text);font-size:13px;font-weight:800;padding:0;transition:transform .15s,background .15s,border-color .15s}
.cb:hover{border-color:var(--accent)}
.done>.cb,.cb.on{background:var(--good);border-color:var(--good);color:#fff}
@keyframes pop{50%{transform:scale(1.2)}}
@media (prefers-reduced-motion:no-preference){.done>.cb,.cb.on{animation:pop .25s}}
.tt{font-weight:600;min-width:0;overflow-wrap:anywhere;unicode-bidi:plaintext}
.tmeta{font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-family:var(--mono);letter-spacing:-.01em}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.good{background:var(--good-soft);color:var(--good)}
.sc{display:inline-grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:2px 6px;border-radius:5px;color:hsl(var(--h) 60% 34%);background:hsl(var(--h) 70% 92%);vertical-align:2px;margin-inline-end:4px;line-height:1.4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sc{color:hsl(var(--h) 80% 76%);background:hsl(var(--h) 40% 18%)}}
:root[data-theme="dark"] .sc{color:hsl(var(--h) 80% 76%);background:hsl(var(--h) 40% 18%)}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--mono);font-weight:700;font-size:21px}
.ring .lbl small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;font-family:var(--body);letter-spacing:.06em;text-transform:uppercase}

/* controls */
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,var(--text))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px;unicode-bidi:plaintext}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
label.f>*{margin-top:5px;text-transform:none;letter-spacing:0;font-weight:400;font-size:14.5px;color:var(--text)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* bars & lists */
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.g>i{background:var(--good)}
.subj{cursor:pointer;transition:border-color .15s,transform .15s}
.subj:hover{border-color:var(--faint)}
.subj.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.subj .em .sc{font-size:12px;padding:3px 8px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow .tt{flex:1}
.lrow.w .tt{color:var(--muted)}
.date{font-size:12px;color:var(--muted);white-space:nowrap}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:12px;height:12px;border-radius:2px;background:var(--h0)}
.heat i[data-l="1"]{background:var(--h1)}.heat i[data-l="2"]{background:var(--h2)}.heat i[data-l="3"]{background:var(--h3)}.heat i[data-l="4"]{background:var(--h4)}
.heat i.today{outline:2px solid var(--text);outline-offset:-1px}

/* mistakes & notes */
.mk{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;background:var(--surface)}
.mk-h{padding:14px 18px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.mk-h:hover{background:var(--surface-2)}
.mk-b{padding:2px 18px 18px}
.stem{background:var(--surface-2);border-radius:8px;padding:12px 14px;margin-bottom:12px;white-space:pre-wrap;unicode-bidi:plaintext}
.opt{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.opt.c{border-color:color-mix(in srgb,var(--good) 55%,var(--border));background:var(--good-soft)}
.opt.p{border-color:color-mix(in srgb,var(--bad) 55%,var(--border));background:var(--bad-soft)}
.opt .k{font-family:var(--mono);font-weight:700;margin-inline-end:8px}
.opt .why{font-size:13.5px;color:var(--muted);margin-top:4px}
.opt.c .why,.opt.p .why{color:var(--text)}
.pearl{border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--border));background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-weight:500}
.ai{border:1.5px dashed color-mix(in srgb,var(--accent) 50%,var(--border));background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.ai.drag{border-style:solid;border-color:var(--accent)}
.note{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--border)}
.note:last-child{border-bottom:0}
.note .nt{flex:1;min-width:0;overflow-wrap:anywhere}
.note.star .nt:before{content:"★ ";color:var(--warn)}
.nsys{display:flex;gap:6px;flex-wrap:wrap}
.md h1,.md h2,.card .md h3{font-family:var(--display);font-size:16px;margin:14px 0 6px;text-transform:none;letter-spacing:-.01em;color:var(--text);display:block}
.md ul{margin:4px 0;padding-inline-start:20px}
.md p{margin:6px 0}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
.md th,.md td{border:1px solid var(--border);padding:6px 8px;text-align:start;vertical-align:top}
.md th{background:var(--surface-2);font-weight:700}
.tblwrap{overflow-x:auto;max-width:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block}
.thumbs button{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;padding:0}

/* timeline */
.tl{position:relative;padding-inline-start:24px}
.tl:before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tli{position:relative;margin-bottom:14px}
.tli:before{content:"";position:absolute;inset-inline-start:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--faint)}
.tli.now:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tli.past:before{background:var(--good);border-color:var(--good)}

/* overlays */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--text) 45%,transparent);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;font-weight:600}
.alert{border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;background:var(--bad);color:#fff;display:flex;gap:14px;align-items:center}
.alert .ai2{font-family:var(--mono);font-weight:700;font-size:13px;border:1.5px solid rgba(255,255,255,.7);border-radius:6px;padding:4px 8px;flex:none}
.alert>div:last-child{min-width:0;flex:1}
.alert b{font-size:17px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:30px;margin-bottom:4px}
.timer{font-size:52px;font-weight:700;letter-spacing:-.05em;text-align:center;line-height:1.1}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center}
.sw{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;border:3px solid transparent;cursor:pointer;display:grid;place-items:end center;padding:6px;color:#fff;font-weight:700;font-size:11.5px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.sw.on{border-color:var(--text)}
.welcome{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@media (prefers-reduced-motion:no-preference){.welcome{animation:fade .3s}}
.welcome .card{width:min(500px,100%);text-align:center;padding:26px 22px;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.welcome .hello{font-size:26px;font-weight:800}
.welcome .stat{background:var(--surface-2);border-radius:8px;padding:10px}
.welcome .stat b{display:block;font-size:22px;font-family:var(--mono)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.badge{text-align:center;padding:12px 6px;border-radius:10px;border:1px solid var(--border)}
.badge .bi{font-size:28px;line-height:1.3}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge .bn{font-weight:600;font-size:12.5px;margin-top:4px}
.confetti{position:fixed;top:-12px;width:8px;height:13px;border-radius:2px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
svg text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
svg.chart{direction:ltr}
</style>

  });
  const total = days.reduce((n,day)=>n+(activity(day)?1:0),0);
  return `<svg class="trace" viewBox="0 0 ${W} 80" preserveAspectRatio="none" role="img" aria-label="Study activity, last 30 days: ${total} active days"><path pathLength="1" d="${d}"/></svg><div class="ecg-cap"><span>Last 30 days · one beat per day, taller = more done</span><span class="mono">${total}/30 active</span></div>`;

// move whole subjects between periods, or change their order, and re-spread the period's remaining lectures
function freeDays(a, z){ const cu = Number(set_().catchup), out = []; for (let d = a; d <= z; d = addDays(d,1)) if (dow(d) !== cu && !BLOCKS().some(b => b.kind !== "lectures" && d >= b.start && d <= b.end)) out.push(d); return out; }
function spreadPeriod(pb, order, lec){
  const [a, z] = blockRange(pb), t = T();
  const pool = lec.filter(l => l.d && l.d >= a && l.d <= z && !S.watched[String(l.n)]);
  pool.sort((x,y) => (order.indexOf(x.s) + 1 || 99) - (order.indexOf(y.s) + 1 || 99) || x.n - y.n);
  const D = freeDays(pb.start > t ? pb.start : t, pb.end); if (!D.length || !pool.length) return 0;
  pool.forEach((l,i) => l.d = D[Math.min(D.length-1, Math.floor(i*D.length/pool.length))]);
  return Math.ceil(pool.length / D.length);
}
function planMove(sj, toId){
  const pb = lecBlocks().find(b => b.id === toId); if (!pb) return;
  const lec = S.lectures.map(l => ({...l})), mine = lec.filter(l => l.s === sj && !S.watched[String(l.n)]);
  mine.forEach(l => l.d = pb.start > T() ? pb.start : T());
  const order = subjBlocks(pb).map(x => x.s).filter(x => x !== sj).concat(sj);
  const per = spreadPeriod(pb, order, lec);
  return {lec, per, pb, n:mine.length};
}
function planReorder(pid, sj, dir){
  const pb = lecBlocks().find(b => b.id === pid); if (!pb) return;
  const order = subjBlocks(pb).filter(x => x.L.some(l => !S.watched[String(l.n)])).map(x => x.s), i = order.indexOf(sj), j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  const lec = S.lectures.map(l => ({...l})); const per = spreadPeriod(pb, order, lec);
  return {lec, per, pb};
}
function commitPlan(lec){
  S.lectures = lec; const pe = {...(set_().planEnds||{})}; [...new Set(lec.map(l => l.s))].forEach(sj => { pe[sj] = lec.filter(l => l.s === sj && l.d).reduce((a,l) => l.d > a ? l.d : a, ""); });
  S.settings = {...set_(), planEnds:pe}; saveLectures(); saveSettings(); render();
}

function replanPreview(){
  const s = set_(), t = T(), info = replanInfo(t);
  if (!info.b) return toast("No lecture block to re-plan");
  if (!info.ok){
    modal(`<h3>Re-plan is locked</h3><p>Re-plan opens on <b>${fmt(info.opens,{weekday:"long",day:"numeric",month:"long"})}</b>, ${Number(s.replanWindow)||5} days before the <b>${esc(info.sb ? info.sb.s : info.b.name)}</b> block ends (${fmt(info.end)}).</p><p class="sub">Until then, stick to the plan and use Fridays to catch up on what's late. That's what keeps the block on time.</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-close="1">Got it</button></div>`);
    return;
  }
  const per = Math.max(1, perOn(t));
  const [, z] = blockRange(info.b);
  const rem = S.lectures.filter(l => l.d && l.d <= z && !S.watched[String(l.n)]).sort((a,b)=> a.d.localeCompare(b.d) || a.n - b.n);
  if (!rem.length){ toast("Nothing scheduled left to re-plan"); return; }
  const oldEnd = rem[rem.length-1].d;
  let d = t, used = lecturesWatchedOn(t).length;
  const plan = [];
  for (const l of rem){
    while (isCatchup(d) || used >= per){ d = addDays(d,1); used = 0; }
    plan.push([l.n, d]); used++;
  }
  const newEnd = plan[plan.length-1][1];
  modal(`<h3>Re-plan ${esc(info.b.name)}</h3><p class="sub">${rem.length} remaining lectures of this block will be spread from <b>${fmt(t)}</b>, ${per} per day, skipping ${["Sundays","Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays"][s.catchup]}.</p>
  <div class="grid g2" style="gap:10px;margin:12px 0"><div class="card" style="box-shadow:none"><div class="sub">Old finish</div><div class="big" style="font-size:22px">${fmt(oldEnd)}</div></div><div class="card" style="box-shadow:none"><div class="sub">New finish</div><div class="big" style="font-size:22px;color:${newEnd>oldEnd?"var(--warn)":"var(--good)"}">${fmt(newEnd)}</div></div></div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-close="1">Cancel</button><button class="btn pri" data-doreplan="1">Apply</button></div>`);
  S._replan = plan;
}

function toggleWatch(n){
  const k = String(n);
  if (S.watched[k]) delete S.watched[k]; else S.watched[k] = T();
  S.watched = {...S.watched};
  saveWatched(); render();
  if (S.watched[k]){ const P = dayPlan(T()); if (P.tot.done === P.tot.total){ toast("🎉 Day complete — " + cheer()); confetti(); } else toast(cheer()); }
}
function toggleDay(field){
  const d = T(); const cur = {...(S.days[d]||{})}; cur[field] = !cur[field]; S.days[d] = cur; saveDay(d); render();
  if (cur[field]){ const P = dayPlan(d); if (P.tot.done === P.tot.total){ toast("🎉 Day complete — " + cheer()); confetti(); } else toast(cheer()); }
}
function logUw(sys, qs, correct){
  if (!(qs > 0)) return toast("Enter number of questions");
  const id = Date.now().toString(36);
  const rec = {id, date:T(), at:new Date().toISOString(), sys:Number(sys), qs, correct: isNaN(correct)?null:correct};
  S.sessions = [...S.sessions, rec];
  const x = S.uworld.find(u=>u.n==sys); if (x) x.done = Math.min(x.q, (x.done||0)+qs);
  S.uworld = [...S.uworld];
  if (S.db) save("uw_sessions/"+id, rec);
  saveUworld(); render(); toast(`Logged ${qs} Qs ✓`);
}

function htmlToText(html){
  const box = document.createElement("div"); box.style.cssText = "position:fixed;left:-9999px;top:0;white-space:normal"; box.innerHTML = html;
  box.querySelectorAll("script,style").forEach(x => x.remove());
  box.querySelectorAll("table").forEach(tb => {
    const rows = [...tb.querySelectorAll("tr")].map(tr => [...tr.children].map(c => c.innerText.replace(/\s*\n\s*/g," / ").replace(/\|/g,"/").trim()));
    if (!rows.length) return;
    const w = Math.max(...rows.map(r => r.length)); rows.forEach(r => { while (r.length < w) r.push(""); });
    const md = ["| " + rows[0].join(" | ") + " |", "|" + " --- |".repeat(w), ...rows.slice(1).map(r => "| " + r.join(" | ") + " |")].join("\n");
    const pre = document.createElement("pre"); pre.textContent = "\n" + md + "\n"; tb.replaceWith(pre);
  });
  document.body.appendChild(box); const t = box.innerText; box.remove();
  return t.replace(/\n{3,}/g, "\n\n").trim();
}

const sysName = n => (S.uworld.find(u => u.n == n) || {}).s || "Other";

const AR = /[\u0600-\u06FF]/;
const firstStrong = x => {
  const t = String(x).replace(/\*\*/g, ""), m = t.match(/[A-Za-z\u0621-\u064A]/); if (!m) return "ltr";
  const ar = (t.match(/[\u0621-\u064A]/g)||[]).length, la = (t.match(/[A-Za-z]/g)||[]).length;
  return /[\u0621-\u064A]/.test(m[0]) ? (la > ar * 2.5 ? "ltr" : "rtl") : (ar > la ? "rtl" : "ltr");
};
// keep English runs (terms, arrows, numbers) intact inside Arabic lines
function bidiRuns(raw){
  if (!AR.test(raw)) return esc(raw);
  // English runs (terms, arrows, numbers) stay intact inside Arabic lines; brackets stay outside so they mirror correctly
  const re = /[A-Za-z0-9][A-Za-z0-9 .,'’\-+\/%:=↑↓→←⇒↔&°μ±≥≤~#]*[A-Za-z0-9↑↓→←%]|[A-Za-z0-9]/g;
  let out = "", at = 0, m;
  while ((m = re.exec(raw))){ out += esc(raw.slice(at, m.index)) + `<bdi dir="ltr">${esc(m[0])}</bdi>`; at = m.index + m[0].length; }
  return out + esc(raw.slice(at));
}
function mdBlock(kind, body){
  const L = body.map(x => x.trimEnd()).filter(x => x.trim());
  if (kind === "cards"){
    const cards = []; let cur = null;
    L.forEach(x => { const h = x.match(/^#{1,3}\s+(.*)/); if (h){ const [t, sub] = h[1].split("|").map(s => s.trim()); cur = {t, sub, items:[]}; cards.push(cur); } else if (cur) cur.items.push(x.replace(/^\s*[-*•]\s+/, "")); });
    return `<div class="mdcards">${cards.map((c,i) => `<div class="mdcard"><div class="mdcard-ic">${esc((c.t||"?").trim().slice(0,1))}</div><div style="min-width:0;flex:1"><div class="mdcard-t" dir="${firstStrong(c.t)}">${mdInline(c.t)}</div>${c.sub ? `<div class="mdcard-s" dir="${firstStrong(c.sub)}">${mdInline(c.sub)}</div>` : ""}<ul dir="${firstStrong(c.items.join(" "))}">${c.items.map(it => `<li dir="${firstStrong(it)}">${mdInline(it)}</li>`).join("")}</ul></div></div>`).join("")}</div>`;
  }
  if (kind === "flow"){
    return `<div class="mdflow">${L.map((x,i) => { const hi = x.startsWith("!"), soft = x.startsWith("~"), t = x.replace(/^[!~]\s*/, ""); return `${i ? `<div class="mdflow-ar">↓</div>` : ""}<div class="mdflow-step ${hi ? "hi" : soft ? "soft" : ""}" dir="${firstStrong(t)}">${mdInline(t)}</div>`; }).join("")}</div>`;
  }
  if (kind === "quiz"){
    let q = "", why = "", ans = -1; const opts = [];
    L.forEach(x => { if (/^(Q|س)\s*:/i.test(x)) q = x.replace(/^(Q|س)\s*:\s*/i, ""); else if (/^(Why|ليه)\s*:/i.test(x)) why = x.replace(/^(Why|ليه)\s*:\s*/i, ""); else if (/^\s*[-*•]\s+/.test(x)){ let o = x.replace(/^\s*[-*•]\s+/, ""); if (/\s*\(\*\)\s*$|\s+\*\s*$/.test(o)){ ans = opts.length; o = o.replace(/\s*\(\*\)\s*$|\s+\*\s*$/, ""); } opts.push(o); } else if (!q) q = x; });
    return `<div class="mdquiz" data-ans="${ans}"><div class="mdquiz-q" dir="${firstStrong(q)}">${mdInline(q)}</div>${opts.map((o,i) => `<button class="mdquiz-o" data-qopt="${i}" dir="${firstStrong(o)}"><i></i><span>${mdInline(o)}</span></button>`).join("")}${why ? `<div class="mdquiz-why" hidden dir="${firstStrong(why)}">${mdInline(why)}</div>` : ""}</div>`;
  }
  return `<pre class="mdpre">${esc(body.join("\n"))}</pre>`;
}
function mdLite(md){
  const out = []; let inList = false;
  const lines = String(md||"").split("\n"), inl = mdInline;
  for (let li = 0; li < lines.length; li++){
    let line = lines[li].trimEnd();
    const fence = line.match(/^\s*```\s*([a-z-]*)\s*$/i);
    if (fence){ if (inList){ out.push("</ul>"); inList = false; } const body = []; li++; while (li < lines.length && !/^\s*```\s*$/.test(lines[li])){ body.push(lines[li]); li++; } out.push(mdBlock(fence[1].toLowerCase(), body)); continue; }
    if (firstStrong(line) === "ltr") line = line.replace(/\s*،\s*/g, ", ");
    if (/^\s*[-*•]\s+/.test(line)){ const txt = line.replace(/^\s*[-*•]\s+/,""); if (!inList){ out.push(`<ul dir="${firstStrong(txt)}">`); inList = true; } out.push(`<li dir="${firstStrong(txt)}">${inl(txt)}</li>`); continue; }
    if (inList){ out.push("</ul>"); inList = false; }
    if (/^\s*\|/.test(line)){
      const rows = []; while (li < lines.length && /^\s*\|/.test(lines[li])){ rows.push(lines[li].trim()); li++; } li--;
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^[|:\-\s]+$/.test(r));
      if (!body.length) continue;
      const [head, ...rest] = body, dir = firstStrong(rows.join(" "));
      out.push(`<div class="tblwrap"><table dir="${dir}"><thead><tr>${cells(head).map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rest.map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)/); if (h){ out.push(`<h3 dir="${firstStrong(h[2])}">${inl(h[2])}</h3>`); continue; }
    if (line.trim()) out.push(`<p dir="${firstStrong(line)}">${inl(line)}</p>`);
  }
  if (inList) out.push("</ul>");
  return out.join("");
}
function mdInline(x){
  return String(x).split(/(\[\[[^\]]+\]\]|\*\*[^*]+\*\*)/g).map(part => {
    const t = part.match(/^\[\[([^\]|]+)(?:\|([^\]]+))?\]\]$/);
    if (t) return `<span class="term" tabindex="0"${t[2] ? ` data-def="${esc(t[2])}" title="${esc(t[2])}"` : ""}>${bidiRuns(t[1])}</span>`;
    const b = part.match(/^\*\*([^*]+)\*\*$/);
    return b ? `<b>${mdInline(b[1])}</b>` : bidiRuns(part).replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<i>$2</i>");
  }).join("");
}

function tour(i){
  $("#tourBox")?.remove(); if (i === 0){ S._tourAt = 0; S._tourDir = 1; }
  if (i < 0 || i >= TOUR.length){ if (S.settings && !S.settings.toured){ S.settings = {...S.settings, toured:true}; saveSettings(); } if (S.tab !== "today"){ S.tab = "today"; render(); } return; }
  const st = TOUR[i];
  if (st.tab === "members" && !(S.isOwner && S.members.length)) return tour(i + (S._tourDir || 1));
  if (st.tab && S.tab !== st.tab){ S.tab = st.tab; S.flash = null; render(); window.scrollTo(0, 0); }
  setTimeout(() => {
    const el = st.sel.split(",").map(x => document.querySelector(x.trim())).find(Boolean);
    if (!el) return tour(i + (S._tourDir || 1));
    el.scrollIntoView({block:"center", behavior:"instant"});
    const r = el.getBoundingClientRect(), pad = 6, vw = innerWidth, vh = innerHeight, ch = 230;
    const box = document.createElement("div"); box.id = "tourBox"; box.className = "tour";
    const below = r.bottom + ch + 20 < vh, cardTop = below ? Math.min(vh - ch - 10, r.bottom + 12) : Math.max(12, r.top - 12 - ch);
    const cardLeft = Math.max(12, Math.min(vw - 392, r.left));
    box.innerHTML = `<div class="tour-hole" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
      <div class="tour-card" style="top:${cardTop}px;left:${cardLeft}px" role="dialog" aria-label="Tour step ${i+1} of ${TOUR.length}">
        <div class="row between" dir="rtl"><b>${mdInline(st.t)}</b><span class="mono sub">${i+1}/${TOUR.length}</span></div>
        <div dir="rtl" style="margin:6px 0 12px;line-height:1.7;font-family:var(--arabic)">${mdInline(st.ar)}</div>
        <div class="row" style="gap:6px"><button class="btn sm ghost" data-tour="end">Skip</button><span style="flex:1"></span>${i?`<button class="btn sm" data-tour="${i-1}">Back</button>`:""}<button class="btn sm pri" data-tour="${i+1}">${i===TOUR.length-1?"Let's go":"Next"}</button></div>
      </div>`;
    document.body.appendChild(box);
  }, 60);
}

function obChatRules(){
  const tpl = S.tpl, st = tpl.settings, lp = lecPeriods(tpl), dp = defaultPlan(tpl), t = T();
  return `You are the setup assistant inside a USMLE Step 1 tracker website. A new student is joining their friend's study plan (Dr. Ta7 video lectures + UWorld). Talk to them directly in short, friendly Egyptian Arabic (medical terms in English). Today is ${t}.
${window.STEP1_SITE ? "" : `FIRST, before asking anything: if you have the notion_search tool, search their Notion for an existing Step 1 / USMLE plan (try "Step 1", "USMLE", "Ta7", "UWorld", "study plan", "lectures"), open the best hits with notion_fetch, and take every answer you can from it (start date, finished lectures per subject, dates, UWorld progress).  Then tell them in one short line what you found, or that you found nothing / Notion isn't connected. Never ask something you already found.
`}Then find out what's still missing (anything they don't know → use the friend's choice):
1. name
2. when they started Dr. Ta7 lectures
3. how many lectures they finished in each subject (they may say it loosely, e.g. "خلصت Heme كله ونص Endo")
4. Step 1 exam date (friend's: ${st.exam})
5. Dedicated start (friend's: ${st.dedicated})
6. catch-up day with no new lectures (friend's: ${DAYS[st.catchup]||"Friday"})
7. which subjects in which period, in order. Periods and the friend's choice:
${lp.map(b => `   - ${b.id}: ${periodLabel(tpl, b)} → ${dp[b.id].join(", ")}`).join("\n")}
8. UWorld questions per day (friend's: ${lp.map(b=>b.uw).join(" → ")} by period) and questions already done per system.
9. max lectures per day (default 2). If they are behind, they catch up at this pace, never more.
How to talk: interactive, ONE or TWO short questions at a time; wait for the answer, then ask the next. Tell them once that "مش عارف" is fine. Don't repeat questions they answered. Convert loose answers yourself (e.g. "نص Endo" → about 10 of 19; "من أسبوعين" → a date).
If they don't know: start date → today; Dedicated → as soon as their lectures would realistically finish, not later than the friend's; exam → the friend's date unless impossible; anything else → the friend's choice.
When you have the answers, or they say finish/خلاص, reply with one short line and then this block (fenced exactly like this):
\`\`\`setup
{"name": "...", "start": "YYYY-MM-DD", "exam": "YYYY-MM-DD" | null, "dedicated": "YYYY-MM-DD" | null, "catchupDay": "Friday" | null,
 "plan": {${lp.map(b=>`"${b.id}": ["Subject", ...]`).join(", ")}} | null,
 "uworldPerDay": 20 | null, "lecturesPerDay": 2 | null, "watched": {"Heme": 0}, "uworldDone": {"Cardiovascular System": 0}}
\`\`\`
Use null for unknowns. Subject names exactly: ${subjOrder(tpl).map(sj => `${sj} (${tpl.lectures.filter(l=>l.s===sj).length})`).join(", ")}. In "plan" every subject appears once, in study order. UWorld systems exactly: ${tpl.uworld.map(x=>x.s).join("; ")}.`;
}

// the viewer's Notion, offered to Claude as tools during setup (missing connector → Claude just asks instead)
async function notionTools(){
  if (S.mcp === undefined){ try { S.mcp = await window.claude?.use?.("mcp"); } catch { S.mcp = null; } }
  if (!S.mcp) return [];
  const call = async (tool, input, signal) => {
    try { const r = await S.mcp.callTool("Notion", tool, input, {signal}); const out = typeof r.payload === "string" ? r.payload : JSON.stringify(r.payload ?? r.content); return out.slice(0, 30000); }
    catch (e) { throw new Error(e?.code === "server_not_connected" ? "Notion isn't connected for this person." : e?.code === "needs_reauth" ? "Their Notion connection needs to be reconnected." : e?.code === "approval_required" ? "They didn't allow Notion for this page." : (e?.code || "error") + ": " + (e?.message || "")); }
  };
  return [
    {name:"notion_search", description:"Search the student's Notion workspace. Returns matching pages/databases with ids and titles.", inputSchema:{type:"object", properties:{query:{type:"string"}}, required:["query"]}, execute:(i, c) => call("notion-search", {query:String(i.query||"")}, c.signal)},
    {name:"notion_fetch", description:"Read one Notion page or database by its id or URL (from notion_search). Returns its content.", inputSchema:{type:"object", properties:{id:{type:"string"}}, required:["id"]}, execute:(i, c) => call("notion-fetch", {id:String(i.id||"")}, c.signal)}
  ];
}
async function obChatSend(text, hidden){
  const o = S.onboard; text = (text ?? $("#obMsg")?.value ?? "").trim(); if (!text || o.busy) return;
  o.chat = [...o.chat, {role:"user", content:text, ...(hidden ? {hidden:true} : {})}]; o.draft = ""; o.busy = true; render();
  const live = () => $("#obLive"); if (live()) live().innerHTML = `<div class="bub bot"><div class="sub">✨ …</div></div>`;
  $("#obLog")?.scrollTo?.(0, 1e6);
  const turns = o.chat.slice(1).map((m,i) => ({role:m.role, content: i === 0 ? obChatRules() + "\n\nStudent:\n" + m.content : m.content}));
  try {
    const tools = await notionTools();
    const {text:ans} = await S.sample(turns, {cache:false, modelTier:"default", ...(tools.length ? {tools} : {}), onText:({text}) => { const el = live(); if (el) el.innerHTML = `<div class="bub bot"><div class="md">${mdLite(text.replace(/```setup[\s\S]*$/,""))}</div></div>`; }});
    const sb = String(ans).match(/```setup\s*([\s\S]*?)```/);
    const shown = String(ans).replace(/```setup[\s\S]*?```/, "").trim();
    o.chat = [...o.chat, {role:"assistant", content: shown || "تمام، جهّزتلك الخطة 👇"}];
    o.busy = false; render(); setTimeout(() => $("#obLog")?.scrollTo?.(0, 1e6), 30);
    if (sb){ let cfg; try { cfg = normCfg(JSON.parse(sb[1])); } catch { return toast("Couldn't read the plan. Say خلاص again."); } const r = buildPlan(cfg); if (r.errs){ o.chat = [...o.chat, {role:"assistant", content:"ناقصني بس: " + r.errs.join("، ")}]; render(); return; } obPreview(r); }
  } catch (e) {
    o.busy = false; o.chat = [...o.chat, {role:"assistant", content: e?.code === "not_granted" ? "الـ AI مش شغال دلوقتي. استخدم Answer here." : "حصلت مشكلة، جرّب تاني."}]; render();
  }
}

function applyOps(ops){

// ---------- device-only storage (when the shared storage won't take this viewer's writes) ----------
function localDb(prefix){
  const K = p => "s1.l." + prefix + p, subs = [];
  const read = p => { try { const v = localStorage.getItem(K(p)); return v ? JSON.parse(v) : null; } catch { return null; } };
  const snap = p => { const d = read(p); return {id:p.split("/").pop(), exists:!!d, data:() => d}; };
  const fire = () => setTimeout(() => subs.forEach(f => f()));
  const write = (p, v) => { try { localStorage.setItem(K(p), JSON.stringify(v)); } catch { return Promise.reject({code:"storage_full"}); } fire(); return Promise.resolve(); };
  return {
    doc: p => ({get: async () => snap(p), set: v => write(p, v), update: v => write(p, {...(read(p)||{}), ...v}),
      delete: () => { try { localStorage.removeItem(K(p)); } catch {} fire(); return Promise.resolve(); },
      onSnapshot(n){ const f = () => n(snap(p)); subs.push(f); setTimeout(f); return () => {}; }}),
    collection: c => ({onSnapshot(n){ const f = () => { const pre = K(c + "/"), docs = []; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k.startsWith(pre) && !k.slice(pre.length).includes("/")) docs.push(snap(c + "/" + k.slice(pre.length))); } } catch {} n({docs, size:docs.length, empty:!docs.length}); }; subs.push(f); setTimeout(f); return () => {}; }})
  };
}

  if (S.isOwner) setInterval(pushTemplate, 15000);
  if (S.isOwner){ setInterval(pushSummary, 20000); setTimeout(pushSummary, 3000); }
  const mergeMembers = () => { S.members = [...(S._mem||[]), ...(S._gst||[])]; loadProfiles(); if (S.ready) softRender(); };
  if (S.membersRef) S.membersRef.onSnapshot(q => { S._mem = q.docs.map(d => ({id:d.id, ...d.data()})); mergeMembers(); }, e => console.error(e));
  if (S.guestsRef) S.guestsRef.onSnapshot(q => { S._gst = q.docs.map(d => ({id:d.id, guest:true, ...d.data()})).filter(m => m.lt); mergeMembers(); }, e => console.error(e));
  if (S.memberDoc){ setInterval(pushSummary, 20000); setTimeout(pushSummary, 3000); }
  coll("notes", L => { const m = {}; L.forEach(x => { const {id, ...rest} = x; m[id] = rest; }); S.notes = m; });
  setTimeout(() => { if (!S.ready){ S.ready = true; render(); } }, 6000);
})();
})();
</script>
